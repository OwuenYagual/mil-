<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Para ti</title>
</head>

<body>
    <div id="app" class="container">
            <div id="scene" class="scene">
                <button type="button" id="heartBtn" class="heart-btn">
                    <svg id="icon" class="icon heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path id="shape"
                            d="M2 9.1371C2 14 6.01943 16.5914 8.96173 18.9109C10 19.7294 11 20.5 12 20.5C13 20.5 14 19.7294 15.0383 18.9109C17.9806 16.5914 22 14 22 9.1371C22 4.27416 16.4998 0.825464 12 5.50063C7.50016 0.825464 2 4.27416 2 9.1371Z" />
                    </svg>
                    <span class="label">Amada mía</span>
                </button>
            </div>
            <div id="message-container" class="message-container">
            <h1>Te amo mucho Milly</h1>
            <p>Con todo mi amor, este árbol representa lo mucho que has crecido en mi corazón.</p>
            <p> ¿Quieres ser mi San Valentin?</p>

            <div class="counter-wrapper">
                <p class="counter-title">Mi amor por ti comenzó hace...</p>
                <div id="timer" class="timer">
                    <div class="time-block"><span id="days">0</span><small>días</small></div>
                    <div class="time-block"><span id="hours">0</span><small>horas</small></div>
                    <div class="time-block"><span id="minutes">0</span><small>minutos</small></div>
                    <div class="time-block"><span id="seconds">0</span><small>segundos</small></div>
                </div>
            </div>

        </div>
        <script src="js/script.js"></script>
</body>

</html>
